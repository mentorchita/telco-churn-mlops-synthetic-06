[pytest]
# Slide 11: pytest configuration for the Telco Churn test suite

testpaths = tests

# Markers
markers =
    slow: marks tests that train the model (scope='module' reduces this to once)
    integration: marks integration tests that require a live API
    smoke: marks smoke tests run immediately after deploy

# Output
addopts =
    --tb=short
    -q

# Minimum coverage (enforced in CI with --cov flags per job)
# Run locally:  pytest --cov=src --cov-report=html --cov-fail-under=80

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
