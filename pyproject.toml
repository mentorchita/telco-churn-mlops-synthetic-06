[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "telco-churn-mlops"
version = "1.0.0"
description = "Telco Churn prediction — Modern MLOps Module 6 demo project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true

# Local ./mlflow/ directory shadows the real mlflow package.
# Skip it so mypy does not treat the empty namespace as the real library.
[[tool.mypy.overrides]]
module = "mlflow"
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80          # homework assignment 2: ≥80% coverage
